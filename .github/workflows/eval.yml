name: Evaluation Pipeline Gate

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  evaluate:
    env:
      HF_ENDPOINT: https://hf-mirror.com
      FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache FastEmbed Models
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/fastembed
          key: ${{ runner.os }}-fastembed-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-fastembed-

      - name: Install uv and Dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv pip install --system -r pyproject.toml

      - name: Run Evaluation Gate
        run: |
          python eval/run_eval.py